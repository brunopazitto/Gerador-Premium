<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativador de Ofertas Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --apple-blue: #0071e3;
            --apple-blue-hover: #005bb5;
            --apple-green: #34c759;
            --apple-green-hover: #2eb050;
            --apple-gray: #86868b;
            --bg-color: #f5f5f7;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --telegram-color: #24A1DE;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #e0eafc, #cfdef3, #e0c3fc, #8ec5fc);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 28px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.12);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .header h1 {
            color: var(--text-main);
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 10px;
            background: -webkit-linear-gradient(45deg, #0071e3, #8ec5fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            padding: 18px 20px;
            font-size: 16px;
            border: 2px solid rgba(0, 0, 0, 0.05);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.9);
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            background: #ffffff;
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        button.btn-primary {
            width: 100%;
            padding: 18px;
            font-size: 17px;
            font-weight: 700;
            color: white;
            background-color: var(--apple-blue);
            border: none;
            border-radius: 980px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
        }

        button.btn-primary.loading {
            background-color: var(--apple-gray);
            cursor: wait;
        }

        /* Área de Resultado */
        .result-area {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-redirect {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
            font-size: 18px;
            font-weight: 800;
            color: white;
            background-color: var(--apple-green);
            text-decoration: none;
            border-radius: 20px;
            transition: all 0.3s ease;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(52, 199, 89, 0.3);
        }

        .btn-redirect:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(52, 199, 89, 0.4);
        }

        /* Banner VIP Telegram */
        .telegram-banner {
            background: rgba(36, 161, 222, 0.08);
            border: 1px solid rgba(36, 161, 222, 0.2);
            border-radius: 22px;
            padding: 24px;
            text-align: center;
            margin-top: 10px;
        }

        .telegram-banner h3 {
            font-size: 17px;
            color: var(--telegram-color);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .telegram-banner p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .btn-telegram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            background-color: var(--telegram-color);
            color: white;
            text-decoration: none;
            border-radius: 980px;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
            animation: pulseTelegram 2s infinite;
        }

        @keyframes pulseTelegram {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .btn-telegram:hover {
            background-color: #1e88be;
            transform: translateY(-2px);
        }

        .toast {
            position: fixed;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(29, 29, 31, 0.9);
            color: white;
            padding: 14px 28px;
            border-radius: 980px;
            font-size: 15px;
            font-weight: 600;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            bottom: 40px;
        }
    </style>
</head>
<body>

    <div class="glass-card" id="mainCard">
        <div class="header">
            <h1>Desbloquear Oferta</h1>
            <p>Ative benefícios exclusivos no Mercado Livre com apenas um clique.</p>
        </div>

        <div class="input-group">
            <input type="url" id="linkInput" placeholder="Cole o link do produto aqui..." autocomplete="off">
        </div>

        <button class="btn-primary" id="btnGerar" onclick="iniciarMagica()">Aplicar Desconto ✨</button>

        <div class="result-area" id="resultArea">
            <a href="#" target="_blank" class="btn-redirect" id="linkRedirecionamento">
                🛒 IR PARA A LOJA <span>→</span>
            </a>

            <div class="telegram-banner">
                <h3>Grupo VIP de Ofertas</h3>
                <p>Receba erros de preço e cupons exclusivos antes de todo o mundo.</p>
                <a href="https://t.me/garimpeiml" target="_blank" class="btn-telegram">
                    ENTRAR NO TELEGRAM
                </a>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz2YniUQvGbzXhAkhnm4wGePZut0tR8SYM3MNFcN60QLvXaOfTkgaW8TTFNyEWqj0H6kQ/exec";

        let linkComissionadoGlobal = "";

        async function iniciarMagica() {
            const input = document.getElementById('linkInput').value.trim();
            const btnGerar = document.getElementById('btnGerar');
            const resultArea = document.getElementById('resultArea');

            if (!input || !input.includes('mercadolivre.com.br')) {
                mostrarToast("Link inválido do Mercado Livre 🧐");
                return;
            }

            btnGerar.classList.add('loading');
            btnGerar.innerText = "Sincronizando oferta... ⏳";

            notificarAdmin(input);

            setTimeout(() => {
                const url = new URL(input);
                const linkLimpo = url.origin + url.pathname;
                linkComissionadoGlobal = `${linkLimpo}?matt_tool=57853447&matt_word=brunin_p21`;

                document.getElementById('linkRedirecionamento').href = linkComissionadoGlobal;

                btnGerar.classList.remove('loading');
                btnGerar.innerText = "Aplicar Novo Desconto ✨";
                resultArea.style.display = 'block';
                
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#0071e3', '#34c759', '#ffe600']
                });
            }, 1200);
        }

        async function notificarAdmin(link) {
            try {
                const urlComParametro = WEB_APP_URL + "?link=" + encodeURIComponent(link);
                await fetch(urlComParametro, { method: 'GET', mode: 'no-cors' });
            } catch (e) {
                console.log("Processado.");
            }
        }

        function mostrarToast(mensagem) {
            const toast = document.getElementById('toast');
            toast.innerText = mensagem;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
