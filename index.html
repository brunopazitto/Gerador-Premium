<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Ofertas Premium</title>
    <style>
        /* Tipografia nativa e reset */
        :root {
            --apple-blue: #0071e3;
            --apple-blue-hover: #005bb5;
            --bg-color: #f5f5f7;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Fundo com gradiente suave animado */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #e0eafc, #cfdef3, #e0c3fc, #8ec5fc);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Efeito Glassmorphism (Vidro Fosco) */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .header h1 {
            color: var(--text-main);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Campos de entrada padrão Apple */
        .input-group {
            position: relative;
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            background: #ffffff;
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        /* Botão em formato de pílula */
        button {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background-color: var(--apple-blue);
            border: none;
            border-radius: 980px; /* Arredondamento extremo */
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--apple-blue-hover);
            transform: scale(0.98);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Área de Resultado Oculta por padrão */
        .result-area {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            animation: slideUp 0.4s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-area p {
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .copy-box {
            display: flex;
            gap: 10px;
        }

        .copy-box input {
            flex: 1;
            background: rgba(0, 0, 0, 0.03);
            border-color: transparent;
            color: var(--text-muted);
            font-size: 14px;
        }

        .copy-btn {
            width: auto;
            padding: 0 24px;
            background-color: #e8e8ed;
            color: var(--text-main);
        }

        .copy-btn:hover {
            background-color: #d2d2d7;
        }

        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 980px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            bottom: 50px;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="header">
            <h1>Ativar Desconto</h1>
            <p>Cole o link do produto do Mercado Livre abaixo para gerar o seu acesso com os melhores benefícios.</p>
        </div>

        <div class="input-group">
            <input type="url" id="linkInput" placeholder="Ex: https://produto.mercadolivre.com.br/..." autocomplete="off">
        </div>

        <button onclick="gerarLinkAfiliado()">Gerar Link Mágico</button>

        <div class="result-area" id="resultArea">
            <p>Pronto! Seu link está preparado:</p>
            <div class="copy-box">
                <input type="text" id="finalLink" readonly>
                <button class="copy-btn" onclick="copiarLink()" id="btnCopiar">Copiar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Link copiado com sucesso! 🚀</div>

    <script>
        function gerarLinkAfiliado() {
            const input = document.getElementById('linkInput').value.trim();
            const resultArea = document.getElementById('resultArea');
            const finalLink = document.getElementById('finalLink');

            if (!input) {
                mostrarToast("Por favor, cole um link primeiro.");
                return;
            }

            try {
                // Tenta validar se é uma URL real
                const url = new URL(input);
                
                if (!url.hostname.includes('mercadolivre.com.br')) {
                    mostrarToast("Ops! Parece que não é um link do Mercado Livre.");
                    return;
                }

                // A MÁGICA: Limpa qualquer rastreador antigo e coloca o seu!
                const linkLimpo = url.origin + url.pathname;
                const linkComissionado = `${linkLimpo}?matt_tool=57853447&matt_word=brunin_p21`;

                // Mostra o resultado na tela suavemente
                finalLink.value = linkComissionado;
                resultArea.style.display = 'block';
                
            } catch (e) {
                mostrarToast("Link inválido. Verifique se copiou corretamente.");
            }
        }

        function copiarLink() {
            const finalLink = document.getElementById('finalLink');
            const btnCopiar = document.getElementById('btnCopiar');

            // Seleciona e copia
            finalLink.select();
            finalLink.setSelectionRange(0, 99999); // Para dispositivos móveis
            navigator.clipboard.writeText(finalLink.value);

            // Feedback visual no botão
            const textoOriginal = btnCopiar.innerText;
            btnCopiar.innerText = "Copiado!";
            btnCopiar.style.backgroundColor = "#34c759"; // Verde Apple
            btnCopiar.style.color = "white";

            mostrarToast("Link copiado! Agora é só colar no navegador. 🚀");

            // Volta o botão ao normal depois de 2 segundos
            setTimeout(() => {
                btnCopiar.innerText = textoOriginal;
                btnCopiar.style.backgroundColor = "#e8e8ed";
                btnCopiar.style.color = "var(--text-main)";
            }, 2000);
        }

        function mostrarToast(mensagem) {
            const toast = document.getElementById('toast');
            toast.innerText = mensagem;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
