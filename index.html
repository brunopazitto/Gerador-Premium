<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativador de Ofertas Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --apple-blue: #0071e3;
            --apple-blue-hover: #005bb5;
            --apple-green: #34c759;
            --apple-green-hover: #2eb050;
            --bg-color: #f5f5f7;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #e0eafc, #cfdef3, #e0c3fc, #8ec5fc);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 20px;
            overflow: hidden; /* Evita rolagem durante os confetes */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 28px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.12);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 10;
        }

        /* Efeito de balanço quando o card aparece */
        .glass-card.shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .header h1 {
            color: var(--text-main);
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 10px;
            background: -webkit-linear-gradient(45deg, #0071e3, #8ec5fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            padding: 18px 20px;
            font-size: 16px;
            border: 2px solid rgba(0, 0, 0, 0.05);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        input:focus {
            background: #ffffff;
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
            transform: translateY(-2px);
        }

        button.btn-primary {
            width: 100%;
            padding: 18px;
            font-size: 17px;
            font-weight: 700;
            color: white;
            background-color: var(--apple-blue);
            border: none;
            border-radius: 980px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
        }

        button.btn-primary:hover {
            background-color: var(--apple-blue-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 113, 227, 0.4);
        }

        button.btn-primary.loading {
            background-color: #86868b;
            cursor: wait;
            transform: scale(0.98);
        }

        /* Área de Sucesso */
        .result-area {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Botão Verde Gigante Pulsante */
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(52, 199, 89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
        }

        .btn-redirect {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
            font-size: 18px;
            font-weight: 800;
            color: white;
            background-color: var(--apple-green);
            text-decoration: none;
            border-radius: 20px;
            animation: pulseGlow 2s infinite;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-redirect:hover {
            background-color: var(--apple-green-hover);
            transform: scale(1.02);
        }

        .btn-redirect span {
            margin-left: 8px;
            font-size: 22px;
        }

        /* Linkzinho menor de copiar */
        .btn-copy-small {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s ease;
        }

        .btn-copy-small:hover {
            color: var(--apple-blue);
        }

        .toast {
            position: fixed;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(29, 29, 31, 0.9);
            color: white;
            padding: 14px 28px;
            border-radius: 980px;
            font-size: 15px;
            font-weight: 600;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
            z-index: 100;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            bottom: 40px;
        }
    </style>
</head>
<body>

    <div class="glass-card" id="mainCard">
        <div class="header">
            <h1>Desbloquear Oferta</h1>
            <p>Cole o link do Mercado Livre abaixo e veja a mágica acontecer para ativar os benefícios.</p>
        </div>

        <div class="input-group">
            <input type="url" id="linkInput" placeholder="Ex: https://produto.mercadolivre.com.br/..." autocomplete="off">
        </div>

        <button class="btn-primary" id="btnGerar" onclick="iniciarMagica()">Aplicar Desconto ✨</button>

        <div class="result-area" id="resultArea">
            <a href="#" target="_blank" class="btn-redirect" id="linkRedirecionamento">
                🛒 IR PARA A LOJA <span>→</span>
            </a>
            <button class="btn-copy-small" onclick="copiarLinkOculto()" id="btnCopiarMini">
                Ou clique aqui apenas para copiar o link
            </button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let linkComissionadoGlobal = "";

        function iniciarMagica() {
            const input = document.getElementById('linkInput').value.trim();
            const btnGerar = document.getElementById('btnGerar');
            const resultArea = document.getElementById('resultArea');
            const card = document.getElementById('mainCard');

            if (!input) {
                mostrarToast("Cole um link primeiro! 😅");
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 500);
                return;
            }

            try {
                const url = new URL(input);
                if (!url.hostname.includes('mercadolivre.com.br')) {
                    mostrarToast("Esse link não parece ser do Mercado Livre 🤔");
                    card.classList.add('shake');
                    setTimeout(() => card.classList.remove('shake'), 500);
                    return;
                }

                // Esconde a área de resultado se já estiver aberta
                resultArea.style.display = 'none';

                // Efeito de "Pensando" (Delay de 1 segundo para dar emoção)
                btnGerar.classList.add('loading');
                btnGerar.innerText = "Preparando a mágica... ⏳";
                
                setTimeout(() => {
                    // Limpa rastreadores e insere os seus dados
                    const linkLimpo = url.origin + url.pathname;
                    linkComissionadoGlobal = `${linkLimpo}?matt_tool=57853447&matt_word=brunin_p21`;

                    // Configura o botão de redirecionamento
                    document.getElementById('linkRedirecionamento').href = linkComissionadoGlobal;

                    // Volta o botão ao normal
                    btnGerar.classList.remove('loading');
                    btnGerar.innerText = "Aplicar Novo Desconto ✨";

                    // Mostra o resultado e solta os confetes!
                    resultArea.style.display = 'block';
                    dispararConfetes();

                }, 1200); // 1.2 segundos de suspense

            } catch (e) {
                mostrarToast("Link inválido. Verifique se copiou inteiro!");
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 500);
            }
        }

        function dispararConfetes() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#0071e3', '#34c759', '#ffe600'] // Cores da Apple e do ML
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#0071e3', '#34c759', '#ffe600']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function copiarLinkOculto() {
            navigator.clipboard.writeText(linkComissionadoGlobal);
            const btnMini = document.getElementById('btnCopiarMini');
            
            btnMini.innerText = "Copiado com sucesso! ✅";
            btnMini.style.color = "var(--apple-green)";
            
            setTimeout(() => {
                btnMini.innerText = "Ou clique aqui apenas para copiar o link";
                btnMini.style.color = "var(--text-muted)";
            }, 3000);
        }

        function mostrarToast(mensagem) {
            const toast = document.getElementById('toast');
            toast.innerText = mensagem;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
